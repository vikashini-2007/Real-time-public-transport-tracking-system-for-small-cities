<!DOCTYPE html>
<html>
<head>
<title>Add Route</title>
<style>
body{
font-family:Arial;
background:#f4f4f4;
}
.box{
width:400px;
background:white;
padding:30px;
margin:80px auto;
border-radius:15px;
}
input,button{
width:100%;
padding:12px;
margin:10px 0;
}
button{
background:#2a5298;
color:white;
border:none;
}
</style>
</head>
<body>

<div class="box">

<h2>Add Route</h2>

<form method="POST">

<input type="text" name="source" placeholder="Source" required>

<input type="text" name="destination" placeholder="Destination" required>

<button>Add Route</button>
<a href="/dashboard" class="back-btn">
        ⬅ Back to Dashboard
    </a>
</form>

</div>

</body>
</html>
