<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{
background:linear-gradient(135deg,#1e3c72,#2a5298);
font-family:Arial;
}
.box{
width:350px;
background:white;
padding:40px;
margin:100px auto;
border-radius:15px;
}
input,button{
width:100%;
padding:12px;
margin:10px 0;
}
button{
background:#2a5298;
color:white;
border:none;
}
</style>
</head>
<body>

<div class="box">
<h2>Login</h2>

<form method="POST">

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

</div>

</body>
</html>
